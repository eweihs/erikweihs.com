name: Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: eweihs/engineering-standards/.github/workflows/review.yml@v3.1.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
